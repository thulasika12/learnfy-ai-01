services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: learnfy_ai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-learnfy_local_password}
    ports:
      - "3306:3306"
    volumes:
      - learnfy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-learnfy_local_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-learnfy_local_password}@database:3306/learnfy_ai
    depends_on:
      database:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-learnfy_local_password}@database:3306/learnfy_ai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-this-before-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-payhere}
      PAYHERE_ENABLED: ${PAYHERE_ENABLED:-false}
      PAYHERE_SANDBOX: ${PAYHERE_SANDBOX:-true}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_CURRENCY: LKR
      PAYHERE_30_DAY_AMOUNT: ${PAYHERE_30_DAY_AMOUNT:-500.00}
      PAYHERE_365_DAY_AMOUNT: ${PAYHERE_365_DAY_AMOUNT:-5000.00}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  learnfy_mysql_data:
