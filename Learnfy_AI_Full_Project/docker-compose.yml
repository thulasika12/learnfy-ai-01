services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: learnfy_ai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-learnfy_local_password}
    ports:
      - "3306:3306"
    volumes:
      - learnfy_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-learnfy_local_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-learnfy_local_password}@database:3306/learnfy_ai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-this-before-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  learnfy_mysql_data:
