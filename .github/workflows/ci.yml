name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: learnfy_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -ptest-password" --health-interval=5s
          --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://root:test-password@127.0.0.1:3306/learnfy_test
      JWT_SECRET_KEY: ci-only-secret-that-is-longer-than-32-characters
      ENVIRONMENT: testing
      PAYMENTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: Learnfy_AI_Full_Project/backend/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: Learnfy_AI_Full_Project/frontend/package-lock.json}
      - run: pip install -r requirements.txt
        working-directory: Learnfy_AI_Full_Project/backend
      - run: alembic upgrade head
        working-directory: Learnfy_AI_Full_Project/backend
      - run: alembic upgrade head
        working-directory: Learnfy_AI_Full_Project/backend
      - run: python -m pytest -q
        working-directory: Learnfy_AI_Full_Project/backend
      - run: npm ci
        working-directory: Learnfy_AI_Full_Project/frontend
      - run: npm run lint
        working-directory: Learnfy_AI_Full_Project/frontend
      - run: npm run build
        working-directory: Learnfy_AI_Full_Project/frontend
      - run: npm audit --audit-level=high
        working-directory: Learnfy_AI_Full_Project/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: Learnfy_AI_Full_Project/frontend
      - run: npm run test:e2e
        working-directory: Learnfy_AI_Full_Project/frontend
